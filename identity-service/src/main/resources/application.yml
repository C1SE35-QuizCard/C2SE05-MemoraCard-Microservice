server:
  port: 8081
  servlet:
    context-path: /identity

app:
  eureka:
    hostname: ${EUREKA_HOSTNAME:localhost}
    protocol: ${EUREKA_PROTOCOL:http}

spring:
  application:
    name: identity-service
#  config:
#    import: configserver:http://localhost:8888
  cloud:
    config:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    url: ${DBMS_URL}
    username: ${DBMS_USERNAME}
    password: ${DBMS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

eureka:
  client:
    service-url:
      defaultZone: ${app.eureka.protocol}://${app.eureka.hostname}:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:master}
    client-id: ${KEYCLOAK_CLIENT_ID:admin-cli}
    grant-type: ${KEYCLOAK_GRANT_TYPE:client_credentials}
    username: ${KEYCLOAK_USERNAME:admin}
    password: ${KEYCLOAK_PASSWORD:admin}
    admin-realm-client-id: ${KEYCLOAK_ADMIN_REALM_CLIENT_ID:admin-cli}
    admin-realm-client-secret: ${KEYCLOAK_ADMIN_REALM_CLIENT_SECRET:admin-cli-secret}