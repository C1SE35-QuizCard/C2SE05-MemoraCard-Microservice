server:
  port: 8080

app:
  api-prefix: ${API_PREFIX:/api}
  api-prefix-v1: ${API_PREFIX_V1:/api/v1}
  api-prefix-v2: ${API_PREFIX_V2:/api/v2}
  api-insights: ${API_PREFIX_INSIGHTS:/api/insights}

spring:
  application:
    name: api-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
  config:
    import: optional:file:.env[.properties]
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "https://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: notification_service
          uri: lb://notification-service
          predicates:
            - Path=${app.api-prefix-v1}/notification/**
          filters:
            - name: ReactiveAuthentication
            - name: StripPrefix
              args:
                parts: 2
            - name: PrefixPath
              args:
                prefix: /api/v1/ms


        - id: notification_testing_service
          uri: lb://notification-service-for-testing
          predicates:
            - Path=${app.api-prefix-v1}/notification-testing/**
          filters:
            - name: ReactiveAuthentication
            - name: StripPrefix
              args:
                parts: 2
            - name: PrefixPath
              args:
                prefix: /api/v1/ms

        - id: quizcards_ws_auth
          uri: lb://quizcards
          predicates:
            - Path=${app.api-prefix}/ws/**, ${app.api-prefix}/auth/**
          filters:
            - name: ReactiveAuthentication

        - id: quizcards_general_service
          uri: lb://quizcards
          predicates:
            - Path=${app.api-prefix-v1}/**
          filters:
            - name: ReactiveAuthentication

        - id: trolling_service
          uri: lb://trolling-service
          predicates:
            - Path=${app.api-prefix-v1}/trolling/**
          filters:
            - name: ReactiveAuthentication

        - id: block_security_internal
          uri: no://op          # dummy URI, sẽ không được gọi
          predicates:
            - Path=${app.api-insights}/security/internal/**
          filters:
            - name: SetStatus
              args:
                status: 403



eureka:
  instance:
    prefer-ip-address: true # Gửi IP thay vì hostname cho Eureka
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

  client:
    serviceUrl:
      defaultZone: ${EUREKA_ZONE_HTTP_METHOD:http}://${eureka.instance.hostname}:${EUREKA_SERVER_PORT:8761}/eureka/
    fetch-registry: true
    register-with-eureka: true


services:
  security_service_url: "http://security-service/${app.api-insights}/security"